<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYON Health — Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0f;--bg1:#141418;--bg2:#1a1a20;--bg3:#222228;
  --border:#2a2a35;--text:#e8e8f0;--text2:#8888a0;--text3:#3a3a50;
  --gold:#c9a96e;--green:#6fbd3a;--blue:#4a9eff;--coral:#e05c3a;
  --purple:#9b6fd4;--amber:#e09020;--teal:#3ab8a0;
  --hh:52px;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Space Grotesk',sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);background:var(--bg1);
  border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:0;z-index:100}
.hdr-logo{font-size:15px;font-weight:700;letter-spacing:.08em;margin-right:28px;white-space:nowrap}
.hdr-logo span{color:var(--gold)}
.tabs{display:flex;gap:2px;flex:1}
.tab{padding:6px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;
  border-radius:6px;border:none;background:none;font-family:inherit;transition:all .15s}
.tab:hover,.tab.on{color:var(--text);background:var(--bg3)}
.hdr-r{display:flex;align-items:center;gap:14px;margin-left:auto}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green);
  font-family:'IBM Plex Mono',monospace;font-weight:500}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(111,189,58,.4)}50%{box-shadow:0 0 0 4px rgba(111,189,58,0)}}
.sync-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;background:var(--bg3);
  border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;
  font-family:'IBM Plex Mono',monospace;cursor:pointer;transition:all .2s}
.sync-btn:hover{border-color:var(--gold);color:var(--gold)}
.sync-btn.syncing{color:var(--amber);border-color:var(--amber);pointer-events:none}

/* MAIN LAYOUT */
.main{padding-top:var(--hh);min-height:100vh}
.cnt{max-width:1400px;margin:0 auto;padding:18px 20px 40px}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--bg1);border:1px solid var(--border);border-radius:10px;
  padding:14px;position:relative;overflow:hidden}
.kpi-acc{position:absolute;top:0;left:0;right:0;height:2px;border-radius:10px 10px 0 0}
.kpi-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text2);margin-bottom:6px}
.kpi-val{font-size:22px;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:-.02em}

/* SECTION HEADERS */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:13px;font-weight:600;letter-spacing:.04em}
.sec-sub{font-size:11px;color:var(--text2)}

/* FILTER CHIPS */
.frow{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.chip{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);
  color:var(--text2);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--text3);color:var(--text)}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,.08)}

/* AD TABLE */
.ad-table{width:100%;border-collapse:collapse;margin-bottom:20px}
.ad-table thead th{position:sticky;top:var(--hh);background:var(--bg1);
  text-align:left;padding:8px 10px;font-size:10px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);cursor:pointer;
  white-space:nowrap;user-select:none}
.ad-table thead th:hover{color:var(--text2)}
.ad-table thead th .sort-arrow{margin-left:4px;font-size:8px;opacity:.4}
.ad-table thead th.sorted .sort-arrow{opacity:1;color:var(--gold)}
.ad-table tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.ad-table tbody tr:hover{background:var(--bg2)}
.ad-table tbody tr.selected{background:rgba(201,169,110,.06);border-color:var(--gold)}
.ad-table td{padding:8px 10px;font-size:12px;white-space:nowrap;vertical-align:middle}
.plat-badge{display:inline-block;font-size:9px;font-weight:600;font-family:'IBM Plex Mono',monospace;
  padding:2px 6px;border-radius:4px;text-transform:uppercase}
.plat-badge.meta{color:var(--blue);background:rgba(74,158,255,.12)}
.plat-badge.tiktok{color:var(--teal);background:rgba(58,184,160,.12)}
.plat-badge.reddit{color:var(--coral);background:rgba(224,92,58,.12)}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
.status-dot.active{background:var(--green)}
.status-dot.paused{background:var(--amber)}
.status-dot.learning{background:var(--blue)}
.fatigue-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;
  font-weight:600;font-family:'IBM Plex Mono',monospace}
.fatigue-pill.healthy{color:var(--green);background:rgba(111,189,58,.12)}
.fatigue-pill.watch{color:var(--amber);background:rgba(224,144,32,.12)}
.fatigue-pill.warning{color:var(--coral);background:rgba(224,92,58,.12)}
.fatigue-pill.critical{color:#ff4444;background:rgba(255,68,68,.12)}
.mono{font-family:'IBM Plex Mono',monospace}

/* DETAIL PANEL */
.dp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;
  pointer-events:none;transition:opacity .25s}
.dp-overlay.open{opacity:1;pointer-events:auto}
.dp{position:fixed;top:0;right:0;width:420px;height:100vh;background:var(--bg1);
  border-left:1px solid var(--border);z-index:201;transform:translateX(100%);
  transition:transform .3s cubic-bezier(.16,1,.3,1);overflow-y:auto;padding:20px}
.dp.open{transform:translateX(0)}
.dp-close{position:absolute;top:12px;right:12px;width:28px;height:28px;
  background:var(--bg3);border:1px solid var(--border);border-radius:50%;color:var(--text);
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dp-close:hover{border-color:var(--coral);color:var(--coral)}
.dp h2{font-size:16px;margin-bottom:4px;padding-right:40px}
.dp .dp-platform{font-size:11px;color:var(--text2);margin-bottom:16px}
.dp-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.dp-m{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.dp-m-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.dp-m-val{font-size:15px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.dp-section{margin-bottom:16px}
.dp-section h3{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text2);
  text-transform:uppercase;letter-spacing:.08em}
.sparkline{width:100%;height:48px;margin-bottom:8px}
.sparkline path{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sparkline .area{stroke:none;opacity:.15}
.suggestion-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:10px;margin-bottom:6px;font-size:11px;line-height:1.5}
.suggestion-item .s-type{font-size:9px;font-weight:600;font-family:'IBM Plex Mono',monospace;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.s-type.fatigue_warning{color:var(--amber)}
.s-type.swap{color:var(--coral)}
.s-type.pause{color:#ff4444}
.s-type.scale{color:var(--green)}
.fatigue-breakdown{display:flex;flex-direction:column;gap:6px}
.fb-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;
  padding:4px 0;border-bottom:1px solid var(--border)}
.fb-row:last-child{border-bottom:none}
.fb-label{color:var(--text2)}
.fb-val{font-family:'IBM Plex Mono',monospace;font-weight:600}

/* INSPIRATION GRID */
.insp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.insp-card{background:var(--bg1);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;transition:all .15s}
.insp-card:hover{border-color:var(--text3);transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,.35)}
.insp-thumb{height:100px;background:var(--bg3);background-size:cover;background-position:center;
  position:relative}
.insp-source{position:absolute;top:6px;left:6px;font-size:9px;font-weight:600;
  font-family:'IBM Plex Mono',monospace;padding:2px 6px;border-radius:4px;
  background:rgba(0,0,0,.65);color:var(--text);backdrop-filter:blur(4px)}
.insp-body{padding:10px}
.insp-brand{font-size:11px;font-weight:600;margin-bottom:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.insp-desc{font-size:10px;color:var(--text2);line-height:1.4;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.insp-tags{display:flex;gap:4px;flex-wrap:wrap}
.hook-tag{font-size:9px;padding:1px 6px;border-radius:4px;background:var(--bg3);
  border:1px solid var(--border);color:var(--text3);font-family:'IBM Plex Mono',monospace}

/* SWAP FRAMEWORK PLACEHOLDER */
.swap-placeholder{background:var(--bg1);border:2px dashed var(--border);border-radius:10px;
  padding:40px;text-align:center;color:var(--text3);margin-bottom:20px}
.swap-placeholder h3{font-size:14px;margin-bottom:8px;color:var(--text2)}
.swap-placeholder p{font-size:12px;line-height:1.6}

/* EMPTY STATE */
.empty{text-align:center;padding:40px;color:var(--text3)}
.empty-icon{font-size:28px;margin-bottom:8px;opacity:.4}
.empty-msg{font-size:12px}

/* TAB CONTENT */
.tab-content{display:none}
.tab-content.active{display:block}

/* RESPONSIVE */
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(3,1fr)}.insp-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.kpi-row{grid-template-columns:repeat(2,1fr)}.insp-grid{grid-template-columns:1fr}.dp{width:100%}}
</style>
</head>
<body>

<!-- PLACEHOLDER: HTML + JS sections to be added next -->
<div class="hdr">
  <div class="hdr-logo"><span>XYON</span> COMMAND CENTRE</div>
  <div class="tabs">
    <button class="tab on" data-tab="overview">Overview</button>
    <button class="tab" data-tab="inspiration">Inspiration</button>
    <button class="tab" data-tab="swap">Swap Framework</button>
  </div>
  <div class="hdr-r">
    <div class="live"><div class="live-dot"></div> LIVE</div>
    <button class="sync-btn" onclick="doSync()">Sync Now</button>
  </div>
</div>
<div class="main"><div class="cnt" id="app">Loading...</div></div>
<div class="dp-overlay" id="dpOverlay" onclick="closeDetail()"></div>
<div class="dp" id="dp"></div>
<script>
/* JS will be added in next step */
</script>
</body>
</html>
